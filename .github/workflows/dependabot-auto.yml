name: Dependabot Auto-Manager

on:
  workflow_run:
    workflows: ["Test & Publish"]
    types: [completed]

permissions:
  contents: write
  pull-requests: write
  actions: write

jobs:
  manage-dependabot-pr:
    runs-on: ubuntu-latest
    if: startsWith(github.event.workflow_run.head_branch, 'dependabot/')
    steps:
      - name: Get PR info
        id: pr
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          HEAD_BRANCH="${{ github.event.workflow_run.head_branch }}"
          PR_DATA=$(gh pr list --repo "${{ github.repository }}" \
            --head "$HEAD_BRANCH" --state open --json number,title --jq '.[0]')

          if [ -z "$PR_DATA" ] || [ "$PR_DATA" = "null" ]; then
            echo "No open PR found for branch $HEAD_BRANCH"
            echo "found=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          PR_NUMBER=$(echo "$PR_DATA" | jq -r '.number')
          PR_TITLE=$(echo "$PR_DATA" | jq -r '.title')

          echo "number=$PR_NUMBER" >> "$GITHUB_OUTPUT"
          echo "title=$PR_TITLE" >> "$GITHUB_OUTPUT"
          echo "found=true" >> "$GITHUB_OUTPUT"

          # Core dependencies that require manual review
          CORE_DEPS="^Bump (kedro|kfp|google-cloud-aiplatform) "
          if echo "$PR_TITLE" | grep -qiE "$CORE_DEPS"; then
            echo "is_core=true" >> "$GITHUB_OUTPUT"
          else
            echo "is_core=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Auto-merge non-core dependency (CI passed)
        if: >
          steps.pr.outputs.found == 'true' &&
          github.event.workflow_run.conclusion == 'success' &&
          steps.pr.outputs.is_core == 'false'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh pr review "${{ steps.pr.outputs.number }}" \
            --repo "${{ github.repository }}" --approve \
            --body "CI passed. Auto-approving non-core dependency update."
          gh pr merge "${{ steps.pr.outputs.number }}" \
            --repo "${{ github.repository }}" --squash \
            --body "Auto-merged by Dependabot Auto-Manager"

      - name: Fetch changelog for core dependency
        id: changelog
        if: >
          steps.pr.outputs.found == 'true' &&
          github.event.workflow_run.conclusion == 'success' &&
          steps.pr.outputs.is_core == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          PR_TITLE="${{ steps.pr.outputs.title }}"

          # Extract package name and versions from Dependabot PR title
          # Format: "Bump <package> from <old> to <new>"
          PKG=$(echo "$PR_TITLE" | sed -n 's/^Bump \([^ ]*\) from .*/\1/ip')
          OLD_VER=$(echo "$PR_TITLE" | sed -n 's/.*from \([^ ]*\) to .*/\1/ip')
          NEW_VER=$(echo "$PR_TITLE" | sed -n 's/.*to \([^ ]*\)$/\1/ip')

          echo "pkg=$PKG" >> "$GITHUB_OUTPUT"
          echo "old_ver=$OLD_VER" >> "$GITHUB_OUTPUT"
          echo "new_ver=$NEW_VER" >> "$GITHUB_OUTPUT"

          # Try to get GitHub releases between old and new version
          # Map PyPI package names to GitHub repos
          declare -A REPO_MAP=(
            ["kedro"]="kedro-org/kedro"
            ["kfp"]="kubeflow/pipelines"
            ["google-cloud-aiplatform"]="googleapis/python-aiplatform"
          )

          GH_REPO="${REPO_MAP[$PKG]}"
          CHANGES=""

          if [ -n "$GH_REPO" ]; then
            # Fetch releases between old and new version
            CHANGES=$(gh api "repos/$GH_REPO/releases" --paginate --jq \
              ".[] | select(.tag_name | test(\"v?${NEW_VER}\")) | .body" \
              2>/dev/null | head -200)

            # Fallback: fetch the latest release if exact match fails
            if [ -z "$CHANGES" ]; then
              CHANGES=$(gh api "repos/$GH_REPO/releases" --jq \
                "[.[] | select(.tag_name | test(\"v?[0-9]\")) | {tag: .tag_name, body: .body}] |
                 [.[] | select(
                   (.tag | ltrimstr(\"v\")) as \$v |
                   (\$v >= \"$OLD_VER\" and \$v <= \"$NEW_VER\")
                 )] | .[].body" 2>/dev/null | head -200)
            fi

            # Last fallback: just get the latest release body
            if [ -z "$CHANGES" ]; then
              CHANGES=$(gh api "repos/$GH_REPO/releases/latest" --jq '.body' 2>/dev/null | head -100)
              CHANGES="(Could not match exact versions — showing latest release notes)

          $CHANGES"
            fi
          fi

          if [ -z "$CHANGES" ]; then
            CHANGES="Could not automatically fetch changelog. Please check the release notes manually."
          fi

          # Write to file to avoid shell escaping issues
          echo "$CHANGES" > /tmp/changelog.txt

      - name: Request review for core dependency (CI passed)
        if: >
          steps.pr.outputs.found == 'true' &&
          github.event.workflow_run.conclusion == 'success' &&
          steps.pr.outputs.is_core == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          CHANGELOG=$(cat /tmp/changelog.txt 2>/dev/null || echo "Changelog not available.")

          gh pr comment "${{ steps.pr.outputs.number }}" \
            --repo "${{ github.repository }}" --body "$(cat <<EOF
          All CI checks passed for this core dependency update: **${{ steps.pr.outputs.title }}**

          @em-pe Please review and merge manually — this is a core dependency.

          ### Changelog: \`${{ steps.changelog.outputs.pkg }}\` ${{ steps.changelog.outputs.old_ver }} → ${{ steps.changelog.outputs.new_ver }}

          <details>
          <summary>Key changes</summary>

          $CHANGELOG

          </details>
          EOF
          )"

      - name: Handle CI failure
        if: >
          steps.pr.outputs.found == 'true' &&
          github.event.workflow_run.conclusion == 'failure'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          PR_NUM="${{ steps.pr.outputs.number }}"
          REPO="${{ github.repository }}"

          # Count fix attempts via labels
          ATTEMPT_COUNT=$(gh pr view "$PR_NUM" --repo "$REPO" \
            --json labels --jq '[.labels[].name | select(startswith("fix-attempt-"))] | length')

          if [ "$ATTEMPT_COUNT" -ge 3 ]; then
            gh pr comment "$PR_NUM" --repo "$REPO" --body "$(cat <<'EOF'
          Auto-fix failed after 3 attempts for: **${{ steps.pr.outputs.title }}**

          @em-pe Manual intervention required. The automated agent was unable to resolve the CI failures.
          EOF
            )"
            gh pr edit "$PR_NUM" --repo "$REPO" --add-label "manual-review-needed"
          else
            NEXT_ATTEMPT=$((ATTEMPT_COUNT + 1))
            gh pr edit "$PR_NUM" --repo "$REPO" --add-label "fix-attempt-${NEXT_ATTEMPT}"

            # Trigger the agentic fix workflow
            gh workflow run dependabot-fix.lock.yml \
              --repo "$REPO" \
              -f pr_number="$PR_NUM" \
              -f attempt="$NEXT_ATTEMPT"
          fi
